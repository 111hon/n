<head>
  <link id="favicon" rel="icon" href="" />

  <title>Dev html V9</title>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/crypto-js.min.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; 
      width: 100%; height: 100%; 
      overflow: hidden; /* 初始狀態禁止滾動，專注於輸入框 */
      background-color: #000;
      font-family: sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    #inputSection {
      width: 90%; /* 手機版寬度優化 */
      max-width: 400px;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      background: #222;
      border-radius: 8px;
      color: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); /* 增加一點陰影 */
    }
    input, button {
      width: 100%;
      padding: 12px; /* 加大點擊區域 */
      margin-top: 15px;
      font-size: 16px;
      box-sizing: border-box;
      border-radius: 4px;
      border: none;
      outline: none; /* 移除預設框線 */
    }
    button { 
      background-color: #4CAF50; 
      color: white; 
      cursor: pointer; 
      font-weight: bold;
      transition: background 0.2s;
    }
    button:active { background-color: #3e8e41; } /* 手機點擊回饋 */
    
    iframe {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      /* 【修改】核心修正：使用 dvh 解決手機網址列遮擋問題 */
      height: 100%;
      height: 100dvh; 
      border: none; margin: 0; padding: 0;
      z-index: 9999;
      background: #fff; /* 避免載入瞬間黑屏 */
    }
  </style>
</head>

    const passwordInput = document.getElementById("password");
    const decryptBtn = document.getElementById("decryptBtn");
    const messageEl = document.getElementById("message");
    const iframe = document.getElementById("resultFrame");
    const inputSection = document.getElementById("inputSection");

    // 封裝解密函式
    function performDecryption() {
      const password = passwordInput.value;
      if (!password) {
        messageEl.textContent = "請輸入密碼";
        return;
      }
      
      // 如果 encryptedData 是空的，提示使用者（方便除錯）
      if (!encryptedData) {
         messageEl.textContent = "錯誤：尚未填入加密數據 (encryptedData)";
         return;
      }

      try {
        const bytes = CryptoJS.AES.decrypt(encryptedData, password);
        const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
        
        if (!decryptedStr) {
          messageEl.textContent = "密碼錯誤或無法解密。";
          return;
        }

        // --- 【關鍵修正】解密成功後的樣式重置 ---
        
        // 1. 移除輸入區塊
        inputSection.remove();

        // 2. 重置 html 與 body 樣式，讓 iframe 成為主體
        // 移除 flex 和 overflow: hidden，還原為普通文檔流
        document.documentElement.style.overflow = "auto";
        document.body.style.overflow = "auto";
        document.body.style.display = "block";
        document.body.style.backgroundColor = "#fff"; // 重置背景色

        // 3. 顯示 iframe 並寫入內容
        iframe.style.display = "block";
        iframe.srcdoc = decryptedStr;

      } catch (e) {
        console.error(e);
        messageEl.textContent = "解密錯誤（可能是密碼錯誤）";
      }
    }

    // 點擊按鈕事件
    decryptBtn.addEventListener("click", performDecryption);

    // 【新增】支援按 Enter 鍵提交
    passwordInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        performDecryption();
      }
    });

    document.getElementById('favicon').href = canvas.toDataURL();
